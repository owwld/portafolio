<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Cuentas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100">

    <!-- Barra superior con el titulo y boton para salir -->
    <nav class="navbar navbar-dark bg-dark shadow-sm py-3">
        <div class="container">
            <span class="navbar-brand fw-bold">Panel Administrador</span>
            <button type="button" id="btnSalir" class="btn btn-sm btn-danger fw-bold px-3">Salir</button>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row g-4">
            <!-- Lado izquierdo: Formulario para crear o modificar cuentas -->
            <div class="col-md-4">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-dark text-white fw-bold py-3 rounded-top-4" id="tituloForm">
                        Agregar Cuenta
                    </div>
                    <div class="card-body p-4">
                        <form id="formUsuario">
                            <input type="hidden" id="editIndex" value="-1">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Nombre</label>
                                <input type="text" id="campoNombre" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Usuario</label>
                                <input type="text" id="campoUser" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Contraseña</label>
                                <input type="text" id="campoPass" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Rol</label>
                                <select id="campoRol" class="form-select">
                                    <option value="Usuario">Usuario</option>
                                    <option value="Administrador">Administrador</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 fw-bold">Guardar</button>
                            <button type="button" id="btnCancelarEdicion" class="btn btn-outline-secondary w-100 btn-sm mt-2 d-none">Cancelar</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Lado derecho: Tabla donde se muestran todas las cuentas del sistema -->
            <div class="col-md-8">
                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-header bg-white fw-bold py-3 border-bottom">
                        Cuentas Existentes
                    </div>
                    <div class="table-responsive p-3">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light small">
                                <tr>
                                    <th>Nombre</th>
                                    <th>Usuario</th>
                                    <th>Contraseña</th>
                                    <th>Rol</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaUsuarios"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
