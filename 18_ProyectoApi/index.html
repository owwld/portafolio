<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro | MundoSerp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <!-- Cuadro central blanco donde aparecen los formularios -->
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-black text-white text-center py-4 border-0">
                        <h4 class="mb-0 fw-bold">MundoSerp</h4>
                        <small class="text-secondary">Control de Acceso</small>
                    </div>

                    <div class="card-body p-4 bg-white">
                        <!-- Botones superiores para cambiar entre Iniciar Sesion y Crear Cuenta -->
                        <ul class="nav nav-pills nav-fill mb-4 bg-dark p-1 rounded-3" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active fw-bold small rounded-3" id="tab-login" data-bs-toggle="pill" data-bs-target="#panel-login" type="button" role="tab">
                                    Iniciar Sesión
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link fw-bold small rounded-3" id="tab-registro" data-bs-toggle="pill" data-bs-target="#panel-registro" type="button" role="tab">
                                    Crear Cuenta
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content">
                            <!-- SECCION 1: Formulario para personas que ya tienen cuenta -->
                            <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
                                <form id="formLogin">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Usuario</label>
                                        <input type="text" id="inputUser" class="form-control py-2 rounded-3" placeholder="Ej. us1" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold small">Contraseña</label>
                                        <input type="password" id="inputPass" class="form-control py-2 rounded-3" placeholder="Escribe tu contraseña" required>
                                    </div>
                                    <button type="submit" class="btn btn-dark w-100 fw-bold py-2 rounded-3">Ingresar</button>
                                    <div id="errorMsg" class="text-danger small fw-bold mt-3 text-center d-none">
                                        Usuario o contraseña incorrectos.
                                    </div>
                                </form>
                            </div>

                            <!-- SECCION 2: Formulario para visitantes nuevos que desean registrarse -->
                            <div class="tab-pane fade" id="panel-registro" role="tabpanel">
                                <form id="formRegistro">
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Nombre Completo</label>
                                        <input type="text" id="regNombre" class="form-control py-2 rounded-3" placeholder="Ej. Carlos López" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Nombre de Usuario</label>
                                        <input type="text" id="regUser" class="form-control py-2 rounded-3" placeholder="Ej. carlos26" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-bold small">Contraseña</label>
                                        <input type="password" id="regPass" class="form-control py-2 rounded-3" placeholder="Crea una contraseña" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label fw-bold small">Confirmar Contraseña</label>
                                        <input type="password" id="regPassConfirm" class="form-control py-2 rounded-3" placeholder="Repite tu contraseña" required>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100 fw-bold py-2 rounded-3">Registrarme y Entrar</button>
                                    <div id="regErrorMsg" class="text-danger small fw-bold mt-3 text-center d-none"></div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
