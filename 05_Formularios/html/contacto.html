    <!--section id="videos" class="contenido"></section-->
    <section id="videos" class="contenido">
        <div class="video-container" video>
            <video controls>
                <source src="../medios/video/dove.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <!---Sección formulario de Contactanos -->
    <section id="ubicame" class="contenido">
        <fieldset id="formulario">
            <legend>registro</legendl>
                <form action = "#" method = "get" enctype="multipart/form-data">
                    <input type="email" name="null" required placeholder="Ingresa tu email">
                    <input type="password" name="pass" required placeholder="Ingresa tu contraseña">
                    <input type="tel" name="tel" required placeholder="Ingresa tu telefono">
                    <intput type="text" name="noombre" required placeholder="Ingresa tu nombre">
                    <input type="number" name="edad" required placeholder="Ingresa tu edad">
                    <input type="file" name="img" id=""/>

                    <textarea name="mensaje" id="" cols="25" rows="9" required placeholder="Coloca tu mensaje "></textarea>
                    <label for="">Genereal</label>
                    <input type="radio" name="genero" />femenino
                    <input type="radio" name="genero" />masculino

                    <label for = "">Pasatiempos</label>
                    <input type="checkbox" name="ch1" />Musica
                    <input type="checkbox" name="ch2" />Billar
                    <input type="checkbox" name="ch3" />Bailar

                    <label for="">Grado de estudio</label>
                    <select name="" id="">
                        <option value="Bachillerato">Bachillerato</option>
                        <option value="TSU">TSU</option>
                        <option value="ING">ING</option>
                        
                        <input type="submit" name="env" value="Enviar">
                        <input type="button" name="" value="botton"> 
                    </select>
                </form>
        </fieldset>
    </section>

    
    <footer></footer>
    
</body>
