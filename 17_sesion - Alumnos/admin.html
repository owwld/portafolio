<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">
    <nav class="navbar navbar-dark bg-dark shadow-sm py-3">
        <div class="container">
            <span class="navbar-brand fw-bold mb-0">Zona Administrador</span>
            <div class="d-flex align-items-center">
                <span id="infoUsuario" class="text-white me-3 fw-bold"></span>
                <button class="btn btn-sm btn-danger fw-bold px-3" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white text-center py-4 border-0">
                        <h4 class="mb-1 fw-bold">Bienvenido admin</h4>
                        <p class="small mb-0 opacity-75">Panel de control</p>
                    </div>
                    <div class="card-body p-4">
                        <div class="alert alert-light border text-center text-muted small mb-4">
                            Sesión iniciada correctamente en el sistema.
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
