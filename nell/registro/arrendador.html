<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NELL - Registro Arrendador (Paso 1)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/estilos.css" />
</head>
<body>
  <header class="encabezado-registro">
    <a href="../index.html" class="logo-nell">NELL<span class="punto">.</span></a>
    <h1>Arrendador</h1>
  </header>

  <main class="contenedor-angosto">
    <form id="formRegistroArr1">
      <section class="panel">
        <h2>Información personal</h2>
        <div class="fila-dos-campos">
          <div class="grupo-campo">
            <label for="arrNombre">Nombre</label>
            <input type="text" id="arrNombre" class="campo-texto" required />
          </div>
          <div class="grupo-campo">
            <label for="arrApellido">Apellido</label>
            <input type="text" id="arrApellido" class="campo-texto" required />
          </div>
        </div>

        <div class="fila-dos-campos">
          <div class="grupo-campo">
            <label for="arrCorreo">Correo</label>
            <input type="email" id="arrCorreo" class="campo-texto" required />
          </div>
          <div class="grupo-campo">
            <label for="arrTelefono">Telefono</label>
            <input type="text" id="arrTelefono" class="campo-texto" required />
          </div>
        </div>

        <div class="fila-dos-campos">
          <div class="grupo-campo">
            <label for="arrCiudad">Ciudad</label>
            <input type="text" id="arrCiudad" class="campo-texto" value="León, Guanajuato" required />
          </div>
          <div class="grupo-campo">
            <label for="arrGenero">Genero</label>
            <select id="arrGenero" class="campo-select" required>
              <option value="Hombre">Hombre</option>
              <option value="Mujer">Mujer</option>
              <option value="Otro">Otro</option>
            </select>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>Seguridad</h2>
        <div class="fila-dos-campos">
          <div class="grupo-campo">
            <label for="arrContrasena">Contraseña</label>
            <input type="password" id="arrContrasena" class="campo-texto" required />
          </div>
          <div class="grupo-campo">
            <label for="arrConfirmar">Confirmar</label>
            <input type="password" id="arrConfirmar" class="campo-texto" required />
          </div>
        </div>
        <p id="errorRegistroArr1" class="mensaje-error"></p>
      </section>

      <div class="grupo-botones">
        <a href="../index.html" class="btn btn-pildora">Regresar</a>
        <button type="submit" class="btn btn-verde btn-pildora">Siguiente</button>
      </div>
    </form>
  </main>

  <script src="../js/storage.js"></script>
  <script src="../js/arrendador.js"></script>
</body>
</html>
